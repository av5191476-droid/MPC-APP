[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"   # mcopy; 7702 es propiedad de la red, no del bytecode
optimizer = true
optimizer_runs = 10_000
fuzz = { runs = 1_000 }

[profile.ci]
fuzz = { runs = 10_000 }

[profile.invariant]
invariant = { runs = 512, depth = 64, fail_on_revert = false }
